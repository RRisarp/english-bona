<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engelska – mängdträning</title>

<!--
  =====================================================================
  ENGELSKA-HUBBEN — deltagarsida
  =====================================================================
  Byggd enligt samma arkitektur som mattehubben:
  - Google-inloggning via Firebase Authentication
  - Varje övningsförsök sparas som ett EGET dokument i Firestore
    under students/{uid}/attempts – ingen överskrivning, full historik.
  - Tre färgteman (ljust / varmt / mörkt), sparas i webbläsaren så
    deltagaren bara behöver välja en gång.

  SÅ HÄR LÄGGER DU TILL FLER KATEGORIER / ÖVNINGAR:
  Leta upp <!-- KATEGORIDATA nedan. Varje kategori är ett objekt i
  CATEGORIES-listan. En "byggd" kategori (som "vanor") har en
  `explanation`-text och en lista av `exercises`. En kategori utan
  dessa fält visas automatiskt som "Innehåll kommer snart".

  Övningstyper som redan finns färdiga att använda (se `type`-fältet):
    - "flerval"      (multiple choice)
    - "lucktext"      (skriv rätt ord/form)
    - "para"          (matcha två spalter)
    - "santfalskt"    (sant/falskt)
    - "oversattning"  (skriv översättning, godkänner flera svar)
  =====================================================================
-->

<style>
  :root[data-theme="light"] {
    --bg: #F5EFE4;
    --card: #FFFFFF;
    --card-alt: #FBF8F3;
    --border: #D9CFBB;
    --border-dashed: #D9D2C4;
    --card-shadow: rgba(90, 70, 30, 0.10);
    --text: #2C2620;
    --text-secondary: #6B6255;
    --text-muted: #B4AFA2;
    --accent: #0F6E56;
    --accent-2: #B5501E;
    --accent-contrast: #FFFFFF;
    --success-bg: #DCEFE6;
    --success-text: #0B4F3D;
    --warning-bg: #F7E3C4;
    --warning-text: #7A5A0B;
    --danger-bg: #F6DCD3;
    --danger-text: #8C3A1E;
  }
  :root[data-theme="warm"] {
    --bg: #F7E6D5;
    --card: #FFF8ED;
    --card-alt: #F3E1CC;
    --border: #D9AD73;
    --border-dashed: #DFC095;
    --card-shadow: rgba(120, 65, 15, 0.14);
    --text: #4A2E1A;
    --text-secondary: #8A6A4C;
    --text-muted: #B79A78;
    --accent: #B5501E;
    --accent-2: #7A3E0B;
    --accent-contrast: #FFF7EE;
    --success-bg: #E3D9B0;
    --success-text: #55480B;
    --warning-bg: #F0CFA0;
    --warning-text: #6E3F07;
    --danger-bg: #E9C2AE;
    --danger-text: #7A2C10;
  }
  :root[data-theme="dark"] {
    --bg: #1C1B1F;
    --card: #313036;
    --card-alt: #232227;
    --border: #4C4851;
    --border-dashed: #423F45;
    --card-shadow: rgba(0, 0, 0, 0.35);
    --text: #F0EDE8;
    --text-secondary: #B3ADA4;
    --text-muted: #766F65;
    --accent: #5DCAA5;
    --accent-2: #E08A5C;
    --accent-contrast: #14231D;
    --success-bg: #0F3B30;
    --success-text: #7FE0BE;
    --warning-bg: #4A3A15;
    --warning-text: #F0C877;
    --danger-bg: #472520;
    --danger-text: #F0A98D;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
    line-height: 1.6;
    transition: background 0.15s, color 0.15s;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 80px; }

  /* Temaväljare */
  .theme-switch { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 18px; }
  .theme-switch button {
    background: var(--card); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .theme-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }

  /* Hero */
  .hero {
    background: var(--card); border-radius: 18px; padding: 32px 28px;
    text-align: center; margin-bottom: 22px; border: 1px solid var(--border);
  }
  .hero h1 { font-size: 26px; margin-bottom: 6px; }
  .hero p { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; }
  .btn { border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-accent { background: var(--accent); color: var(--accent-contrast); }
  .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  #authStatus { font-size: 13px; color: var(--text-secondary); margin-top: 10px; }

  /* Kategorikort */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 16px; text-align: left; cursor: pointer; font-family: inherit; color: inherit;
    box-shadow: 0 2px 6px var(--card-shadow);
  }
  .card:hover { border-color: var(--accent); box-shadow: 0 3px 10px var(--card-shadow); }
  .card.placeholder { background: var(--card-alt); border-style: dashed; border-color: var(--border-dashed); cursor: default; color: var(--text-muted); box-shadow: none; }
  .card .icon { font-size: 20px; }
  .card p.title { font-size: 14px; font-weight: 600; margin: 8px 0 2px; font-family: "Fraunces", serif; }
  .card p.sub { font-size: 12px; color: var(--text-secondary); margin: 0; }
  .card.placeholder p.sub { color: var(--text-muted); }

  /* Kategorisida */
  .back { background: none; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; padding: 0 0 14px; }
  .category-title { font-size: 22px; margin-bottom: 14px; }

  .block { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; background: var(--card); }
  .block-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--card-alt); border: none; text-align: left; cursor: pointer;
    font-family: inherit; color: var(--text); font-size: 14px; font-weight: 600;
  }
  .block-header .meta { font-size: 12px; color: var(--text-secondary); font-weight: 400; }
  .block-body { padding: 14px 16px; border-top: 1px solid var(--border); display: none; }
  .block-body.open { display: block; }
  .chev { transition: transform 0.15s; color: var(--text-secondary); }
  .chev.open { transform: rotate(180deg); }

  .video-slot {
    aspect-ratio: 16/9; background: var(--bg); border-radius: 10px; display: flex;
    align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; margin: 10px 0;
  }

  input[type=text] {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .opt-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .feedback { font-size: 13px; margin-top: 8px; font-weight: 600; }
  .feedback.ok { color: var(--success-text); }
  .feedback.almost { color: var(--warning-text); }
  .feedback.no { color: var(--danger-text); }
  .attempt-count { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

  .match-cols { display: flex; gap: 24px; }
  .match-cols > div { display: flex; flex-direction: column; gap: 8px; }
  .match-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .match-btn.picked { background: var(--accent); color: var(--accent-contrast); }
  .match-btn.correct { background: var(--success-bg); color: var(--success-text); }
  .match-btn.wrong { background: var(--danger-bg); color: var(--danger-text); }

  .locked-note { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="theme-switch" role="group" aria-label="Välj färgtema">
    <button onclick="setTheme('light')" id="theme-light" aria-pressed="true">Ljust</button>
    <button onclick="setTheme('warm')" id="theme-warm" aria-pressed="false">Varmt</button>
    <button onclick="setTheme('dark')" id="theme-dark" aria-pressed="false">Mörkt</button>
  </div>

  <!-- HUB-VY -->
  <div id="view-hub">
    <div class="hero">
      <h1>Engelska – mängdträning</h1>
      <p>Repetera grunderna i din egen takt. Logga in för att spara ditt arbete.</p>
      <button class="btn btn-accent" id="loginBtn" onclick="loginWithGoogle()">Logga in med Google</button>
      <div id="authStatus"></div>
    </div>
    <div class="grid" id="categoryGrid"></div>
  </div>

  <!-- KATEGORI-VY -->
  <div id="view-category" style="display:none;">
    <button class="back" onclick="showHub()">← Tillbaka till alla kategorier</button>
    <h2 class="category-title" id="categoryTitle"></h2>
    <div id="categoryContent"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, where, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

// Din riktiga config, inklistrad från Firebase-konsolen.
const firebaseConfig = {
  apiKey: "AIzaSyAsz_dRu2SqcTWqSwxKbwcWCREhcoIWRF4",
  authDomain: "english-bona-eb2c6.firebaseapp.com",
  projectId: "english-bona-eb2c6",
  storageBucket: "english-bona-eb2c6.firebasestorage.app",
  messagingSenderId: "513678315631",
  appId: "1:513678315631:web:6dd1569aae4edfa5507d9a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

window.loginWithGoogle = async function () {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    console.error(e);
    alert("Inloggningen misslyckades. Försök igen.");
  }
};

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const status = document.getElementById("authStatus");
  const btn = document.getElementById("loginBtn");
  if (user) {
    status.textContent = "Inloggad som " + (user.displayName || user.email);
    btn.textContent = "Logga ut";
    btn.onclick = () => signOut(auth);
  } else {
    status.textContent = "";
    btn.textContent = "Logga in med Google";
    btn.onclick = window.loginWithGoogle;
  }
});

// Sparar ett övningsförsök som ett EGET dokument (ingen historik skrivs över).
async function saveAttempt(categoryId, exerciseId, result, extra) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "students", currentUser.uid, "attempts"), {
      subject: "engelska",
      categoryId,
      exerciseId,
      result,
      studentName: currentUser.displayName || currentUser.email,
      timestamp: serverTimestamp(),
      ...(extra || {})
    });
  } catch (e) {
    console.error("Kunde inte spara försöket:", e);
  }
}

// Räknar hur många gånger en övning gjorts, för visning i gränssnittet.
async function countAttempts(categoryId, exerciseId) {
  if (!currentUser) return 0;
  try {
    const q = query(
      collection(db, "students", currentUser.uid, "attempts"),
      where("categoryId", "==", categoryId),
      where("exerciseId", "==", exerciseId)
    );
    const snap = await getDocs(q);
    return snap.size;
  } catch (e) {
    return 0;
  }
}

// Hämtar det senaste försöket för en lärarrättad övning, för att visa status/kommentar.
async function getLatestAttempt(categoryId, exerciseId) {
  if (!currentUser) return null;
  try {
    const q = query(
      collection(db, "students", currentUser.uid, "attempts"),
      where("categoryId", "==", categoryId),
      where("exerciseId", "==", exerciseId)
    );
    const snap = await getDocs(q);
    if (snap.empty) return null;
    let latest = null;
    snap.forEach(doc => {
      const d = doc.data();
      if (!latest || (d.timestamp && d.timestamp.toMillis() > (latest.timestamp?.toMillis() || 0))) latest = d;
    });
    return latest;
  } catch (e) {
    return null;
  }
}

// ============ TEMA ============
function setTheme(name) {
  document.documentElement.setAttribute("data-theme", name);
  ["light", "warm", "dark"].forEach(t =>
    document.getElementById("theme-" + t).setAttribute("aria-pressed", t === name ? "true" : "false")
  );
  localStorage.setItem("engelska-tema", name);
}
window.setTheme = setTheme;
setTheme(localStorage.getItem("engelska-tema") || "light");

// ============ KATEGORIDATA ============
// En kategori utan `explanation`/`exercises` visas automatiskt som "kommer snart".
const CATEGORIES = [
  { id: "berata", icon: "⏱", title: "Berätta vad som hänt" },
  {
    id: "vanor", icon: "🔁", title: "Beskriva vanor",
    explanation: {
      text: "Vi använder presens (grundform + \"s\" i tredje person singular) när vi beskriver något som är vanligt eller alltid sant – t.ex. rutiner och vanor. Titta på videon eller läs exemplen innan du börjar träna.",
      video: true,
      audio: "Uttalsexempel: she walks, he watches"
    },
    exercises: [
      { id: "vanor-1", title: "Övning 1", type: "flerval",
        question: "She ___ to school every day.",
        options: ["go", "goes", "going", "gone"], correctIndex: 1 },
      { id: "vanor-2", title: "Övning 2", type: "lucktext",
        prompt: "He always ", answerPrefix: "He always ", sentenceAfter: " breakfast at seven.",
        accepted: ["eats", "has"] },
      { id: "vanor-3", title: "Övning 3", type: "para",
        left: ["always", "never", "sometimes"],
        right: [ { text: "alltid", matchIndex: 0 }, { text: "ibland", matchIndex: 2 }, { text: "aldrig", matchIndex: 1 } ] },
      { id: "vanor-4", title: "Övning 4", type: "santfalskt",
        statement: "\"I usually walk to school\" betyder att man vanligtvis går till skolan.",
        correct: true, retakeAllowed: false },
      { id: "vanor-5", title: "Övning 5", type: "oversattning",
        prompt: "Katt", accepted: ["cat", "a cat", "the cat"] },
      { id: "vanor-6", title: "Övning 6", type: "lararrattad",
        prompt: "Skriv en mening om en vana du har. Använd presens." }
    ]
  },
  { id: "framtid", icon: "→", title: "Prata om framtid" },
  { id: "jamfora", icon: "⚖", title: "Jämföra saker" },
  { id: "fragor", icon: "?", title: "Ställa frågor och svara" },
  { id: "asikt", icon: "💬", title: "Uttrycka åsikt" },
  { id: "kat7", icon: "…", title: "Kategori 7" },
  { id: "kat8", icon: "…", title: "Kategori 8" },
  { id: "kat9", icon: "…", title: "Kategori 9" },
  { id: "kat10", icon: "…", title: "Kategori 10" },
  { id: "kat11", icon: "…", title: "Kategori 11" },
  { id: "kat12", icon: "…", title: "Kategori 12" }
];

// ============ RENDERING: HUB ============
function renderHub() {
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const built = !!cat.exercises;
    const el = document.createElement("button");
    el.className = "card" + (built ? "" : " placeholder");
    el.innerHTML = `
      <div class="icon">${cat.icon}</div>
      <p class="title">${cat.title}</p>
      <p class="sub">${built ? doneCountLabel(cat) : "Innehåll kommer snart"}</p>
    `;
    if (built) el.onclick = () => showCategory(cat.id);
    grid.appendChild(el);
  });
}

function doneCountLabel(cat) {
  return cat.exercises.length + " övningar";
}

window.showHub = function () {
  document.getElementById("view-hub").style.display = "block";
  document.getElementById("view-category").style.display = "none";
};

// ============ RENDERING: KATEGORISIDA ============
async function showCategory(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  document.getElementById("view-hub").style.display = "none";
  document.getElementById("view-category").style.display = "block";
  document.getElementById("categoryTitle").textContent = cat.title;

  const content = document.getElementById("categoryContent");
  content.innerHTML = "";

  // Förklaringsdragspel
  if (cat.explanation) {
    content.appendChild(buildExplanationBlock(cat.explanation));
  }

  // Övningsdragspel
  for (const ex of cat.exercises) {
    content.appendChild(await buildExerciseBlock(cat.id, ex));
  }
}
window.showCategory = showCategory;

function buildExplanationBlock(exp) {
  const wrap = document.createElement("div");
  wrap.className = "block";
  const bodyId = "expl-body";
  wrap.innerHTML = `
    <button class="block-header" onclick="toggleBlock(this)">
      <span>Förklaring</span>
      <span class="chev">⌄</span>
    </button>
    <div class="block-body">
      <p style="font-size:14px; color:var(--text-secondary);">${exp.text}</p>
      ${exp.video ? `<div class="video-slot">▶ Youtube-video (byt ut mot &lt;iframe&gt; med din länk)</div>` : ""}
      ${exp.audio ? `<div style="font-size:13px; color:var(--text-secondary);">🔊 ${exp.audio}</div>` : ""}
    </div>
  `;
  return wrap;
}

async function buildExerciseBlock(categoryId, ex) {
  const wrap = document.createElement("div");
  wrap.className = "block";

  let countLabel;
  let latest = null;
  let doneCount = 0;

  if (ex.type === "lararrattad") {
    latest = await getLatestAttempt(categoryId, ex.id);
    const statusLabels = { pending: "Väntar på rättning", approved: "Godkänd", needs_revision: "Behöver skrivas om" };
    countLabel = latest ? statusLabels[latest.status] || "Inskickad" : "Ej inskickad";
    doneCount = latest ? 1 : 0;
  } else {
    doneCount = await countAttempts(categoryId, ex.id);
    countLabel = doneCount > 0 ? `Gjord ${doneCount} ${doneCount === 1 ? "gång" : "gånger"}` : "Ej gjord";
  }

  const header = document.createElement("button");
  header.className = "block-header";
  header.onclick = () => toggleBlock(header);
  header.innerHTML = `<span>${ex.title}</span><span class="meta">${countLabel} <span class="chev">⌄</span></span>`;
  wrap.appendChild(header);

  const body = document.createElement("div");
  body.className = "block-body";
  body.appendChild(buildExerciseBody(categoryId, ex, doneCount, latest));
  wrap.appendChild(body);

  return wrap;
}

function buildExerciseBody(categoryId, ex, doneCount, latest) {
  const container = document.createElement("div");

  if (ex.retakeAllowed === false && doneCount > 0) {
    container.innerHTML = `<p class="locked-note">Den här övningen görs bara en gång och är redan genomförd.</p>`;
    return container;
  }

  if (ex.type === "flerval") {
    const q = document.createElement("p");
    q.style.cssText = "font-size:14px; margin:0 0 4px;";
    q.textContent = ex.question;
    container.appendChild(q);

    const opts = document.createElement("div");
    opts.className = "options";
    ex.options.forEach((optText, i) => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = optText;
      b.onclick = () => {
        const correct = i === ex.correctIndex;
        opts.querySelectorAll("button").forEach(x => { x.style.background = ""; x.style.color = ""; });
        b.style.background = correct ? "var(--success-bg)" : "var(--danger-bg)";
        b.style.color = correct ? "var(--success-text)" : "var(--danger-text)";
        showFeedback(container, correct ? "ok" : "no",
          correct ? "Rätt!" : "Inte riktigt – här är rätt svar: " + ex.options[ex.correctIndex]);
        saveAttempt(categoryId, ex.id, correct ? "korrekt" : "fel");
      };
      opts.appendChild(b);
    });
    container.appendChild(opts);
  }

  if (ex.type === "lucktext") {
    const row = document.createElement("p");
    row.style.cssText = "font-size:14px;";
    const input = document.createElement("input");
    input.type = "text";
    input.style.width = "110px";
    row.append(ex.answerPrefix, input, ex.sentenceAfter);
    container.appendChild(row);

    const btn = document.createElement("button");
    btn.className = "btn btn-outline";
    btn.textContent = "Rätta";
    btn.onclick = () => {
      const val = input.value.trim().toLowerCase();
      const correct = ex.accepted.includes(val);
      showFeedback(container, correct ? "ok" : "almost",
        correct ? "Rätt!" : "Nästan! Kolla stavningen en gång till, eller se facit: " + ex.accepted[0]);
      saveAttempt(categoryId, ex.id, correct ? "korrekt" : "nastan");
    };
    container.appendChild(btn);
  }

  if (ex.type === "para") {
    const instr = document.createElement("p");
    instr.style.cssText = "font-size:13px; color:var(--text-secondary); margin:0 0 10px;";
    instr.textContent = "Klicka på ett ord i vänstra spalten, klicka sedan på dess översättning i högra spalten.";
    container.appendChild(instr);

    const headings = document.createElement("div");
    headings.className = "match-cols";
    headings.style.marginBottom = "4px";
    headings.innerHTML = `
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em;">Engelska</div>
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em;">Svenska</div>
    `;
    container.appendChild(headings);

    const cols = document.createElement("div");
    cols.className = "match-cols";
    const leftCol = document.createElement("div");
    const rightCol = document.createElement("div");
    let pending = null;
    let matchedCount = 0;

    ex.left.forEach((word, i) => {
      const b = document.createElement("button");
      b.className = "match-btn";
      b.textContent = word;
      b.onclick = () => handlePick(b, i, "left");
      leftCol.appendChild(b);
    });
    ex.right.forEach((item) => {
      const b = document.createElement("button");
      b.className = "match-btn";
      b.textContent = item.text;
      b.onclick = () => handlePick(b, item.matchIndex, "right");
      rightCol.appendChild(b);
    });

    function handlePick(btn, id, side) {
      if (btn.disabled) return;
      if (!pending) { pending = { btn, id, side }; btn.classList.add("picked"); return; }
      if (pending.side === side) { pending.btn.classList.remove("picked"); pending = { btn, id, side }; btn.classList.add("picked"); return; }

      const correct = pending.id === id;
      const pendingBtn = pending.btn;
      [pendingBtn, btn].forEach(el => { el.classList.remove("picked"); el.classList.add(correct ? "correct" : "wrong"); });

      if (correct) {
        [pendingBtn, btn].forEach(el => { el.disabled = true; el.style.opacity = "0.55"; el.style.cursor = "default"; });
        matchedCount++;
        showFeedback(container, "ok", matchedCount === ex.left.length ? "Alla par rätt!" : "Rätt par!");
        if (matchedCount === ex.left.length) saveAttempt(categoryId, ex.id, "korrekt");
      } else {
        showFeedback(container, "no", "Fel par – rutorna återställs, försök igen.");
        setTimeout(() => {
          [pendingBtn, btn].forEach(el => el.classList.remove("wrong"));
        }, 900);
        saveAttempt(categoryId, ex.id, "fel");
      }
      pending = null;
    }

    cols.append(leftCol, rightCol);
    container.appendChild(cols);
  }

  if (ex.type === "santfalskt") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.statement;
    container.appendChild(p);

    const opts = document.createElement("div");
    opts.className = "options";
    [["Sant", true], ["Falskt", false]].forEach(([label, val]) => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = label;
      b.onclick = () => {
        const correct = val === ex.correct;
        showFeedback(container, correct ? "ok" : "no", correct ? "Rätt!" : "Inte riktigt.");
        saveAttempt(categoryId, ex.id, correct ? "korrekt" : "fel");
      };
      opts.appendChild(b);
    });
    container.appendChild(opts);
  }

  if (ex.type === "oversattning") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.prompt;
    container.appendChild(p);

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "skriv på engelska";
    input.style.width = "100%";
    container.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "btn btn-outline";
    btn.style.marginTop = "8px";
    btn.textContent = "Rätta";
    btn.onclick = () => {
      const val = input.value.trim().toLowerCase().replace(/[.,!?]/g, "");
      const correct = ex.accepted.includes(val);
      showFeedback(container, correct ? "ok" : "almost",
        correct ? "Rätt!" : "Nästan! Kolla igen, eller se facit: " + ex.accepted[0]);
      saveAttempt(categoryId, ex.id, correct ? "korrekt" : "nastan");
    };
    container.appendChild(btn);
  }

  if (ex.type === "lararrattad") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.prompt;
    container.appendChild(p);

    if (latest && latest.status === "approved") {
      const answerP = document.createElement("p");
      answerP.style.cssText = "font-size:14px; background:var(--card-alt); border-radius:8px; padding:10px 12px; margin:0;";
      answerP.textContent = latest.text;
      container.appendChild(answerP);
      showFeedback(container, "ok", "Godkänd av läraren.");
      if (latest.comment) {
        const c = document.createElement("p");
        c.style.cssText = "font-size:13px; color:var(--text-secondary); margin-top:6px;";
        c.textContent = "Kommentar: " + latest.comment;
        container.appendChild(c);
      }
      return container;
    }

    if (latest && latest.status === "pending") {
      const answerP = document.createElement("p");
      answerP.style.cssText = "font-size:14px; background:var(--card-alt); border-radius:8px; padding:10px 12px; margin:0;";
      answerP.textContent = latest.text;
      container.appendChild(answerP);
      showFeedback(container, "almost", "Skickat – väntar på att läraren rättar.");
      return container;
    }

    if (latest && latest.status === "needs_revision") {
      const prevP = document.createElement("p");
      prevP.style.cssText = "font-size:13px; color:var(--text-muted); margin:0 0 6px;";
      prevP.textContent = "Ditt förra svar: " + latest.text;
      container.appendChild(prevP);
      if (latest.comment) {
        const c = document.createElement("p");
        c.style.cssText = "font-size:13px; color:var(--warning-text); background:var(--warning-bg); border-radius:8px; padding:8px 10px; margin:0 0 10px;";
        c.textContent = "Kommentar från läraren: " + latest.comment;
        container.appendChild(c);
      }
    }

    const textarea = document.createElement("textarea");
    textarea.style.cssText = "width:100%; min-height:70px; font-family:inherit; font-size:14px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:8px 10px;";
    textarea.placeholder = "Skriv ditt svar här...";
    container.appendChild(textarea);

    const btn = document.createElement("button");
    btn.className = "btn btn-accent";
    btn.style.marginTop = "8px";
    btn.textContent = "Skicka in";
    btn.onclick = () => {
      const text = textarea.value.trim();
      if (!text) return;
      saveAttempt(categoryId, ex.id, "inskickad", { gradingType: "larare", status: "pending", text });
      showFeedback(container, "almost", "Skickat – väntar på att läraren rättar.");
      btn.disabled = true;
      textarea.disabled = true;
    };
    container.appendChild(btn);
  }

  return container;
}

function showFeedback(container, kind, text) {
  let f = container.querySelector(".feedback");
  if (!f) {
    f = document.createElement("p");
    container.appendChild(f);
  }
  f.className = "feedback " + kind;
  f.textContent = text;
}

window.toggleBlock = function (headerEl) {
  const body = headerEl.nextElementSibling;
  const chev = headerEl.querySelector(".chev");
  const isOpen = body.classList.contains("open");
  body.classList.toggle("open", !isOpen);
  if (chev) chev.classList.toggle("open", !isOpen);
};

renderHub();
</script>
</body>
</html>

<!--
  =====================================================================
  ENGELSKA-HUBBEN — deltagarsida
  =====================================================================
  Byggd enligt samma arkitektur som mattehubben:
  - Google-inloggning via Firebase Authentication
  - Varje övningsförsök sparas som ett EGET dokument i Firestore
    under students/{uid}/attempts – ingen överskrivning, full historik.
  - Tre färgteman (ljust / varmt / mörkt), sparas i webbläsaren så
    deltagaren bara behöver välja en gång.

  SÅ HÄR LÄGGER DU TILL FLER KATEGORIER / ÖVNINGAR:
  Leta upp <!-- KATEGORIDATA nedan. Varje kategori är ett objekt i
  CATEGORIES-listan. En "byggd" kategori (som "vanor") har en
  `explanation`-text och en lista av `exercises`. En kategori utan
  dessa fält visas automatiskt som "Innehåll kommer snart".

  Övningstyper som redan finns färdiga att använda (se `type`-fältet):
    - "flerval"      (multiple choice)
    - "lucktext"      (skriv rätt ord/form)
    - "para"          (matcha två spalter)
    - "santfalskt"    (sant/falskt)
    - "oversattning"  (skriv översättning, godkänner flera svar)

  Övningar med flera delfrågor i samma dragspel (typerna flerval_inline,
  lucktext_hint, lucktext_bank, lucktext_smallset, korrigera, ordna,
  flerval_abc) har en `items`-lista. Rättas alla på en gång med en
  "Rätta allt"-knapp.

  KATEGORINS "explanation"-fält (bild, video, ljud):
  Varje kategori har ett `explanation`-objekt högst upp bland dess data.
  Lägg till valfria fält där:
    - "image": sökväg till en bild du laddat upp i repot, t.ex. "bilder/beskriva-1.png"
    - "video": bara YOUTUBE-VIDEONS ID (koden efter v= i länken), t.ex. "dQw4w9WgXcQ"
    - "audio": valfri text som beskriver ett ljudklipp (ingen riktig ljudspelare ännu)
  Exempel:
    "explanation": {
      "text": "Vi använder is med...",
      "image": "bilder/beskriva-1.png",
      "video": "dQw4w9WgXcQ"
    }

  FÖRKLARING NÄR SVARET BLIR FEL:
  - Lägg till `"rule": "din förklaring här"` på ÖVNINGS-nivå (samma
    nivå som `"type"` och `"items"`) för en förklaring som gäller alla
    frågor i den övningen.
  - Lägg till `"why": "din förklaring här"` på en ENSKILD FRÅGA inuti
    `items`-listan om just den frågan behöver en egen förklaring
    istället för (eller utöver) övningens gemensamma. `why` vinner
    alltid över `rule` om båda finns för samma fråga.
  - Inget av fälten är obligatoriskt – utan dem visas bara rätt svar,
    som innan.
  =====================================================================
-->

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
let currentUser = null;

window.loginWithGoogle = async function () {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    console.error(e);
    alert("Inloggningen misslyckades. Försök igen.");
  }
};

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const status = document.getElementById("authStatus");
  const btn = document.getElementById("loginBtn");
  if (user) {
    status.textContent = "Inloggad som " + (user.displayName || user.email);
    btn.textContent = "Logga ut";
    btn.onclick = () => signOut(auth);
    loadProgress();
  } else {
    status.textContent = "";
    btn.textContent = "Logga in med Google";
    btn.onclick = window.loginWithGoogle;
    progressByCategory = {};
    renderHub();
  }
});

// categoryId -> Set av exerciseId som gjorts minst en gång (för hub-kortens progression)
let progressByCategory = {};

async function loadProgress() {
  if (!currentUser) return;
  try {
    const q = query(
      collection(db, "students", currentUser.uid, "attempts"),
      where("subject", "==", "engelska")
    );
    const snap = await getDocs(q);
    const map = {};
    snap.forEach(docSnap => {
      const d = docSnap.data();
      if (!d.categoryId || !d.exerciseId) return;
      if (!map[d.categoryId]) map[d.categoryId] = new Set();
      map[d.categoryId].add(d.exerciseId);
    });
    progressByCategory = map;
    renderHub();
  } catch (e) {
    console.error("Kunde inte hämta progression:", e);
  }
}

// Sparar/skriver över deltagarens senaste svar för en övning (en dokument, inte historik).
async function saveLatestState(categoryId, exerciseId, answers, score) {
  if (!currentUser) return;
  try {
    const id = categoryId + "_" + exerciseId;
    await setDoc(doc(db, "students", currentUser.uid, "latest", id), {
      categoryId, exerciseId, answers, score,
      timestamp: serverTimestamp()
    });
  } catch (e) {
    console.error("Kunde inte spara senaste svar:", e);
  }
}

async function getLatestState(categoryId, exerciseId) {
  if (!currentUser) return null;
  try {
    const id = categoryId + "_" + exerciseId;
    const snap = await getDoc(doc(db, "students", currentUser.uid, "latest", id));
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    return null;
  }
}

// Sparar ett övningsförsök som ett EGET dokument (ingen historik skrivs över).
async function saveAttempt(categoryId, exerciseId, result, extra) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "students", currentUser.uid, "attempts"), {
      subject: "engelska",
      categoryId,
      exerciseId,
      result,
      studentName: currentUser.displayName || currentUser.email,
      timestamp: serverTimestamp(),
      ...(extra || {})
    });
  } catch (e) {
    console.error("Kunde inte spara försöket:", e);
  }
}

// Räknar hur många gånger en övning gjorts, för visning i gränssnittet.
async function countAttempts(categoryId, exerciseId) {
  if (!currentUser) return 0;
  try {
    const q = query(
      collection(db, "students", currentUser.uid, "attempts"),
      where("categoryId", "==", categoryId),
      where("exerciseId", "==", exerciseId)
    );
    const snap = await getDocs(q);
    return snap.size;
  } catch (e) {
    return 0;
  }
}

// Hämtar det senaste försöket för en lärarrättad övning, för att visa status/kommentar.
async function getLatestAttempt(categoryId, exerciseId) {
  if (!currentUser) return null;
  try {
    const q = query(
      collection(db, "students", currentUser.uid, "attempts"),
      where("categoryId", "==", categoryId),
      where("exerciseId", "==", exerciseId)
    );
    const snap = await getDocs(q);
    if (snap.empty) return null;
    let latest = null;
    snap.forEach(doc => {
      const d = doc.data();
      if (!latest || (d.timestamp && d.timestamp.toMillis() > (latest.timestamp?.toMillis() || 0))) latest = d;
    });
    return latest;
  } catch (e) {
    return null;
  }
}

  localStorage.setItem("engelska-tema", name);

// ============ RENDERING: HUB ============
function renderHub() {
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const built = !!cat.exercises;
    const el = document.createElement("button");
    const done = built ? (progressByCategory[cat.id] ? progressByCategory[cat.id].size : 0) : 0;
    const total = built ? cat.exercises.length : 0;
    const complete = built && currentUser && done >= total && total > 0;
    el.className = "card" + (built ? "" : " placeholder") + (complete ? " card-complete" : "");
    el.innerHTML = `
      <div class="icon">${cat.icon}</div>
      <p class="title">${cat.title}</p>
      <p class="sub">${built ? doneCountLabel(cat, done) : "Innehåll kommer snart"}</p>
      ${complete ? `<span class="complete-badge">✓</span>` : ""}
    `;
    if (built) el.onclick = () => showCategory(cat.id);
    grid.appendChild(el);
  });
}

function doneCountLabel(cat, done) {
  if (!currentUser) return cat.exercises.length + " övningar";
  return done + " av " + cat.exercises.length + " övningar klara";
}

window.showHub = function () {
  document.getElementById("view-hub").style.display = "block";
  document.getElementById("view-category").style.display = "none";
  loadProgress();
};

// ============ RENDERING: KATEGORISIDA ============
async function showCategory(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  document.getElementById("view-hub").style.display = "none";
  document.getElementById("view-category").style.display = "block";
  document.getElementById("categoryTitle").textContent = cat.title;

  const content = document.getElementById("categoryContent");
  content.innerHTML = "";

  // Förklaringsdragspel
  if (cat.explanation) {
    content.appendChild(buildExplanationBlock(cat.explanation));
  }

  // Övningsdragspel
  for (const ex of cat.exercises) {
    content.appendChild(await buildExerciseBlock(cat.id, ex));
  }
}
window.showCategory = showCategory;

function buildExplanationBlock(exp) {
  const wrap = document.createElement("div");
  wrap.className = "block";
  wrap.innerHTML = `
    <button class="block-header" onclick="toggleBlock(this)">
      <span>Förklaring</span>
      <span class="chev">⌄</span>
    </button>
    <div class="block-body">
      <p style="font-size:14px; color:var(--text-secondary);">${exp.text}</p>
      ${exp.image ? `<img src="${exp.image}" alt="" style="max-width:100%; border-radius:8px; margin:8px 0; display:block;">` : ""}
      ${exp.video ? `<div style="position:relative; width:100%; aspect-ratio:16/9; margin:8px 0;"><iframe src="https://www.youtube.com/embed/${exp.video}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:none; border-radius:8px;" allowfullscreen loading="lazy"></iframe></div>` : ""}
      ${exp.audio ? `<div style="font-size:13px; color:var(--text-secondary);">🔊 ${exp.audio}</div>` : ""}
    </div>
  `;
  return wrap;
}

// ============ VISA SENASTE SVAR (utan att kunna ändra dem direkt) ============
function itemQuestionLabel(ex, item) {
  if (ex.type === "ordna") return item.chips.join(" / ");
  if (ex.type === "bild_flerval" || ex.type === "flerval_abc") return item.question;
  if (item.sentence) return item.sentence.replace("___", "______").replace("__________", "______");
  return "";
}

function buildReviewView(categoryId, ex, state) {
  const container = document.createElement("div");

  const note = document.createElement("p");
  note.style.cssText = "font-size:12px; color:var(--text-muted); margin:0 0 10px;";
  note.textContent = "Ditt senaste försök visas nedan.";
  container.appendChild(note);

  ex.items.forEach((item, idx) => {
    const ans = (state.answers && state.answers[idx]) || {};
    const row = document.createElement("div");
    row.style.cssText = "padding:8px 0; border-top:1px solid var(--border); font-size:14px;";
    if (idx === 0) row.style.borderTop = "none";

    const q = document.createElement("p");
    q.style.cssText = "margin:0 0 3px; color:var(--text-secondary);";
    q.textContent = itemQuestionLabel(ex, item);
    row.appendChild(q);

    const a = document.createElement("p");
    a.style.cssText = "margin:0; font-weight:600;";
    if (ans.correct) {
      a.style.color = "var(--success-text)";
      a.textContent = "✓ " + (ans.given ?? "");
    } else {
      a.style.color = "var(--danger-text)";
      a.textContent = "✗ Du svarade: " + (ans.given || "(inget svar)") + " — rätt svar: " + ans.correctText;
    }
    row.appendChild(a);

    container.appendChild(row);
  });

  const summary = document.createElement("p");
  summary.style.cssText = "font-size:14px; font-weight:600; margin-top:12px;";
  summary.textContent = `Resultat: ${state.score}%`;
  summary.style.color = state.score >= 75 ? "var(--success-text)" : state.score >= 45 ? "var(--warning-text)" : "var(--danger-text)";
  container.appendChild(summary);

  const redoBtn = document.createElement("button");
  redoBtn.className = "btn btn-outline";
  redoBtn.style.marginTop = "10px";
  redoBtn.textContent = "Gör om";
  redoBtn.onclick = () => {
    container.replaceWith(buildSetExercise(categoryId, ex));
  };
  container.appendChild(redoBtn);

  return container;
}

async function buildExerciseBlock(categoryId, ex) {
  const wrap = document.createElement("div");
  wrap.className = "block";

  let countLabel;
  let latest = null;
  let doneCount = 0;

  if (ex.type === "lararrattad") {
    latest = await getLatestAttempt(categoryId, ex.id);
    const statusLabels = { pending: "Väntar på rättning", approved: "Godkänd", needs_revision: "Behöver skrivas om" };
    countLabel = latest ? statusLabels[latest.status] || "Inskickad" : "Ej inskickad";
    doneCount = latest ? 1 : 0;
  } else {
    doneCount = await countAttempts(categoryId, ex.id);
    countLabel = doneCount > 0 ? `Gjord ${doneCount} ${doneCount === 1 ? "gång" : "gånger"}` : "Ej gjord";
  }

  const header = document.createElement("button");
  header.className = "block-header";
  header.onclick = () => toggleBlock(header);
  header.innerHTML = `<span>${ex.title}</span><span class="meta">${countLabel} <span class="chev">⌄</span></span>`;
  wrap.appendChild(header);

  const body = document.createElement("div");
  body.className = "block-body";
  if (ex.items) {
    const state = await getLatestState(categoryId, ex.id);
    if (state) {
      body.appendChild(buildReviewView(categoryId, ex, state));
    } else {
      body.appendChild(buildExerciseBody(categoryId, ex, doneCount, latest));
    }
  } else {
    body.appendChild(buildExerciseBody(categoryId, ex, doneCount, latest));
  }
  wrap.appendChild(body);

  return wrap;
}

function buildExerciseBody(categoryId, ex, doneCount, latest) {
  const container = document.createElement("div");

  if (ex.retakeAllowed === false && doneCount > 0) {
    container.innerHTML = `<p class="locked-note">Den här övningen görs bara en gång och är redan genomförd.</p>`;
    return container;
  }

  if (ex.items) {
    return buildSetExercise(categoryId, ex);
  }

  if (ex.type === "flerval") {
    const q = document.createElement("p");
    q.style.cssText = "font-size:14px; margin:0 0 4px;";
    q.textContent = ex.question;
    container.appendChild(q);

    const opts = document.createElement("div");
    opts.className = "options";
    ex.options.forEach((optText, i) => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = optText;
      b.onclick = () => {
        const correct = i === ex.correctIndex;
        opts.querySelectorAll("button").forEach(x => { x.style.background = ""; x.style.color = ""; });
        b.style.background = correct ? "var(--success-bg)" : "var(--danger-bg)";
        b.style.color = correct ? "var(--success-text)" : "var(--danger-text)";
        showFeedback(container, correct ? "ok" : "no",
          correct ? "Rätt!" : "Inte riktigt – här är rätt svar: " + ex.options[ex.correctIndex]);
        saveAttempt(categoryId, ex.id, correct ? "korrekt" : "fel");
      };
      opts.appendChild(b);
    });
    container.appendChild(opts);
  }

  if (ex.type === "lucktext") {
    const row = document.createElement("p");
    row.style.cssText = "font-size:14px;";
    const input = document.createElement("input");
    input.type = "text";
    input.style.width = "110px";
    row.append(ex.answerPrefix, input, ex.sentenceAfter);
    container.appendChild(row);

    const btn = document.createElement("button");
    btn.className = "btn btn-outline";
    btn.textContent = "Rätta";
    btn.onclick = () => {
      const val = input.value.trim().toLowerCase();
      const correct = ex.accepted.includes(val);
      showFeedback(container, correct ? "ok" : "almost",
        correct ? "Rätt!" : "Nästan! Kolla stavningen en gång till, eller se facit: " + ex.accepted[0]);
      saveAttempt(categoryId, ex.id, correct ? "korrekt" : "nastan");
    };
    container.appendChild(btn);
  }

  if (ex.type === "para") {
    const instr = document.createElement("p");
    instr.style.cssText = "font-size:13px; color:var(--text-secondary); margin:0 0 10px;";
    instr.textContent = "Klicka på ett ord i vänstra spalten, klicka sedan på dess översättning i högra spalten.";
    container.appendChild(instr);

    const headings = document.createElement("div");
    headings.className = "match-cols";
    headings.style.marginBottom = "4px";
    headings.innerHTML = `
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em;">Engelska</div>
      <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em;">Svenska</div>
    `;
    container.appendChild(headings);

    const cols = document.createElement("div");
    cols.className = "match-cols";
    const leftCol = document.createElement("div");
    const rightCol = document.createElement("div");
    let pending = null;
    let matchedCount = 0;

    ex.left.forEach((word, i) => {
      const b = document.createElement("button");
      b.className = "match-btn";
      b.textContent = word;
      b.onclick = () => handlePick(b, i, "left");
      leftCol.appendChild(b);
    });
    ex.right.forEach((item) => {
      const b = document.createElement("button");
      b.className = "match-btn";
      b.textContent = item.text;
      b.onclick = () => handlePick(b, item.matchIndex, "right");
      rightCol.appendChild(b);
    });

    function handlePick(btn, id, side) {
      if (btn.disabled) return;
      if (!pending) { pending = { btn, id, side }; btn.classList.add("picked"); return; }
      if (pending.side === side) { pending.btn.classList.remove("picked"); pending = { btn, id, side }; btn.classList.add("picked"); return; }

      const correct = pending.id === id;
      const pendingBtn = pending.btn;
      [pendingBtn, btn].forEach(el => { el.classList.remove("picked"); el.classList.add(correct ? "correct" : "wrong"); });

      if (correct) {
        [pendingBtn, btn].forEach(el => { el.disabled = true; el.style.opacity = "0.55"; el.style.cursor = "default"; });
        matchedCount++;
        showFeedback(container, "ok", matchedCount === ex.left.length ? "Alla par rätt!" : "Rätt par!");
        if (matchedCount === ex.left.length) saveAttempt(categoryId, ex.id, "korrekt");
      } else {
        showFeedback(container, "no", "Fel par – rutorna återställs, försök igen.");
        setTimeout(() => {
          [pendingBtn, btn].forEach(el => el.classList.remove("wrong"));
        }, 900);
        saveAttempt(categoryId, ex.id, "fel");
      }
      pending = null;
    }

    cols.append(leftCol, rightCol);
    container.appendChild(cols);
  }

  if (ex.type === "santfalskt") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.statement;
    container.appendChild(p);

    const opts = document.createElement("div");
    opts.className = "options";
    [["Sant", true], ["Falskt", false]].forEach(([label, val]) => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.textContent = label;
      b.onclick = () => {
        const correct = val === ex.correct;
        showFeedback(container, correct ? "ok" : "no", correct ? "Rätt!" : "Inte riktigt.");
        saveAttempt(categoryId, ex.id, correct ? "korrekt" : "fel");
      };
      opts.appendChild(b);
    });
    container.appendChild(opts);
  }

  if (ex.type === "oversattning") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.prompt;
    container.appendChild(p);

    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "skriv på engelska";
    input.style.width = "100%";
    container.appendChild(input);

    const btn = document.createElement("button");
    btn.className = "btn btn-outline";
    btn.style.marginTop = "8px";
    btn.textContent = "Rätta";
    btn.onclick = () => {
      const val = input.value.trim().toLowerCase().replace(/[.,!?]/g, "");
      const correct = ex.accepted.includes(val);
      showFeedback(container, correct ? "ok" : "almost",
        correct ? "Rätt!" : "Nästan! Kolla igen, eller se facit: " + ex.accepted[0]);
      saveAttempt(categoryId, ex.id, correct ? "korrekt" : "nastan");
    };
    container.appendChild(btn);
  }

  if (ex.type === "lararrattad") {
    const p = document.createElement("p");
    p.style.cssText = "font-size:14px; margin:0 0 8px;";
    p.textContent = ex.prompt;
    container.appendChild(p);

    if (latest && latest.status === "approved") {
      const answerP = document.createElement("p");
      answerP.style.cssText = "font-size:14px; background:var(--card-alt); border-radius:8px; padding:10px 12px; margin:0;";
      answerP.textContent = latest.text;
      container.appendChild(answerP);
      showFeedback(container, "ok", "Godkänd av läraren.");
      if (latest.comment) {
        const c = document.createElement("p");
        c.style.cssText = "font-size:13px; color:var(--text-secondary); margin-top:6px;";
        c.textContent = "Kommentar: " + latest.comment;
        container.appendChild(c);
      }
      return container;
    }

    if (latest && latest.status === "pending") {
      const answerP = document.createElement("p");
      answerP.style.cssText = "font-size:14px; background:var(--card-alt); border-radius:8px; padding:10px 12px; margin:0;";
      answerP.textContent = latest.text;
      container.appendChild(answerP);
      showFeedback(container, "almost", "Skickat – väntar på att läraren rättar.");
      return container;
    }

    if (latest && latest.status === "needs_revision") {
      const prevP = document.createElement("p");
      prevP.style.cssText = "font-size:13px; color:var(--text-muted); margin:0 0 6px;";
      prevP.textContent = "Ditt förra svar: " + latest.text;
      container.appendChild(prevP);
      if (latest.comment) {
        const c = document.createElement("p");
        c.style.cssText = "font-size:13px; color:var(--warning-text); background:var(--warning-bg); border-radius:8px; padding:8px 10px; margin:0 0 10px;";
        c.textContent = "Kommentar från läraren: " + latest.comment;
        container.appendChild(c);
      }
    }

    const textarea = document.createElement("textarea");
    textarea.style.cssText = "width:100%; min-height:70px; font-family:inherit; font-size:14px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); padding:8px 10px;";
    textarea.placeholder = "Skriv ditt svar här...";
    container.appendChild(textarea);

    const btn = document.createElement("button");
    btn.className = "btn btn-accent";
    btn.style.marginTop = "8px";
    btn.textContent = "Skicka in";
    btn.onclick = () => {
      const text = textarea.value.trim();
      if (!text) return;
      saveAttempt(categoryId, ex.id, "inskickad", { gradingType: "larare", status: "pending", text });
      showFeedback(container, "almost", "Skickat – väntar på att läraren rättar.");
      btn.disabled = true;
      textarea.disabled = true;
    };
    container.appendChild(btn);
  }

  return container;
}

// ============ NYA MOTORN: ÖVNINGAR MED FLERA DELFRÅGOR I SAMMA DRAGSPEL ============
function normalizeAnswer(s) {
  return s.toLowerCase().trim().replace(/[.,!?;:"'’]/g, "").replace(/\s+/g, " ");
}

// ============ ENKLA EGNA ILLUSTRATIONER (ingen extern bild, inga upphovsrättsfrågor) ============
function sceneSVG(kind, position) {
  const W = 260, H = 170, floorY = 150;
  const tableX = 90, tableY = 105, tableW = 80, tableH = 10, legH = 35;
  const boxX = 95, boxY = 80, boxW = 70, boxH = 55;
  const farFloorY = 72;

  const table = `
    <rect x="${tableX}" y="${tableY}" width="${tableW}" height="${tableH}" rx="2" fill="var(--accent-2)"/>
    <rect x="${tableX + 6}" y="${tableY + tableH}" width="6" height="${legH}" fill="var(--text-muted)"/>
    <rect x="${tableX + tableW - 12}" y="${tableY + tableH}" width="6" height="${legH}" fill="var(--text-muted)"/>`;

  function cat(cx, cy, scale) {
    return `
      <g transform="translate(${cx},${cy}) scale(${scale})">
        <ellipse cx="0" cy="0" rx="16" ry="11" fill="var(--accent)"/>
        <circle cx="14" cy="-8" r="8" fill="var(--accent)"/>
        <polygon points="8,-14 12,-22 16,-13" fill="var(--accent)"/>
        <polygon points="16,-14 20,-22 22,-12" fill="var(--accent)"/>
        <path d="M -14 2 Q -26 -6 -20 -16" stroke="var(--accent)" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>`;
  }

  const box = `
    <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" fill="none" stroke="var(--accent-2)" stroke-width="4"/>`;
  function ball(cx, cy) {
    return `<circle cx="${cx}" cy="${cy}" r="14" fill="var(--accent)"/>`;
  }

  let extra = "";
  let farLine = "";
  if (kind === "cat") {
    const groundY = floorY;
    if (position === "on") extra = table + cat(tableX + tableW / 2, tableY - 6, 0.9);
    else if (position === "under") extra = table + cat(tableX + tableW / 2, groundY - 8, 0.85);
    else if (position === "next_to") extra = table + cat(tableX + tableW + 34, groundY - 8, 1);
    else if (position === "behind") extra = cat(tableX + 9, groundY - 8, 0.8) + table;
    else if (position === "in_front_of") extra = table + cat(tableX + tableW / 2, groundY + 6, 1.1);
  } else if (kind === "ball") {
    if (position === "inside") extra = box + ball(boxX + boxW / 2, boxY + boxH / 2 + 8);
    else if (position === "above") extra = ball(boxX + boxW / 2, boxY - 24) + box;
    else if (position === "below") extra = box + ball(boxX + boxW / 2, boxY + boxH + 26);
  }

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:260px; display:block; margin:0 auto 8px;">
    <line x1="0" y1="${floorY}" x2="${W}" y2="${floorY}" stroke="var(--border)" stroke-width="2"/>
    ${extra}
  </svg>`;
}

function buildSetExercise(categoryId, ex) {
  const container = document.createElement("div");

  if (ex.instruction) {
    const instr = document.createElement("p");
    instr.style.cssText = "font-size:13px; color:var(--text-secondary); margin:0 0 12px;";
    instr.textContent = ex.instruction;
    container.appendChild(instr);
  }
  if (ex.bank) {
    const bankP = document.createElement("p");
    bankP.style.cssText = "font-size:13px; background:var(--card-alt); border-radius:8px; padding:8px 10px; margin:0 0 12px;";
    bankP.textContent = ex.bank.join(" · ");
    container.appendChild(bankP);
  }

  const itemGetters = [];
  const list = document.createElement("div");

  ex.items.forEach((item, idx) => {
    const row = document.createElement("div");
    row.style.cssText = "padding:10px 0; border-top:1px solid var(--border);";
    if (idx === 0) row.style.borderTop = "none";
    const resultMark = document.createElement("span");
    resultMark.style.cssText = "margin-left:8px; font-size:13px; font-weight:600;";

    let getResult; // returns {correct: bool, correctText: string}

    if (ex.type === "flerval_inline") {
      const p = document.createElement("p");
      p.style.cssText = "font-size:14px; margin:0 0 6px;";
      const parts = item.sentence.split("___");
      p.append(parts[0]);
      const optWrap = document.createElement("span");
      let chosen = null;
      item.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.style.cssText = "padding:3px 10px; margin:0 4px; font-size:13px;";
        b.textContent = opt;
        b.onclick = () => {
          chosen = i;
          optWrap.querySelectorAll("button").forEach(x => x.classList.remove("picked-inline"));
          b.classList.add("picked-inline");
          b.style.background = "var(--accent)"; b.style.color = "var(--accent-contrast)";
          optWrap.querySelectorAll("button").forEach(x => { if (x !== b) { x.style.background = ""; x.style.color = ""; } });
        };
        optWrap.appendChild(b);
      });
      p.appendChild(optWrap);
      p.append(parts[1] || "");
      p.appendChild(resultMark);
      row.appendChild(p);
      getResult = () => ({ correct: chosen === item.correctIndex, correctText: item.options[item.correctIndex], given: chosen !== null ? item.options[chosen] : null });
    }

    else if (ex.type === "lucktext_hint" || ex.type === "lucktext_hint_choice") {
      const p = document.createElement("p");
      p.style.cssText = "font-size:14px; margin:0 0 6px;";
      const parts = item.sentence.split("__________");
      const input = document.createElement("input");
      input.type = "text";
      input.style.width = "130px";
      p.append(parts[0], input, parts[1] || "");
      if (item.hint) {
        const h = document.createElement("span");
        h.style.cssText = "font-size:12px; color:var(--text-muted); margin-left:6px;";
        h.textContent = "(" + item.hint + ")";
        p.appendChild(h);
      }
      p.appendChild(resultMark);
      row.appendChild(p);
      getResult = () => ({ correct: item.accepted.includes(normalizeAnswer(input.value)), correctText: item.accepted[0], given: input.value.trim() || null });
    }

    else if (ex.type === "lucktext_bank" || ex.type === "lucktext_smallset") {
      const p = document.createElement("p");
      p.style.cssText = "font-size:14px; margin:0 0 6px;";
      const parts = item.sentence.split("__________");
      const select = document.createElement("select");
      select.innerHTML = `<option value="">— välj —</option>` + ex.bank.map(w => `<option value="${normalizeAnswer(w)}">${w}</option>`).join("");
      if (parts.length > 1) {
        p.append(parts[0], select, parts[1] || "");
      } else {
        p.append(item.sentence + " ", select);
      }
      p.appendChild(resultMark);
      row.appendChild(p);
      getResult = () => ({ correct: item.accepted.includes(select.value), correctText: item.accepted[0], given: select.value ? select.options[select.selectedIndex].text : null });
    }

    else if (ex.type === "korrigera") {
      const p1 = document.createElement("p");
      p1.style.cssText = "font-size:14px; margin:0 0 4px; color:var(--text-secondary);";
      p1.textContent = item.sentence + (item.hint ? "  (" + item.hint + ")" : "");
      row.appendChild(p1);
      const p2 = document.createElement("p");
      p2.style.cssText = "font-size:14px; margin:0;";
      const input = document.createElement("input");
      input.type = "text";
      input.style.width = "100%";
      input.placeholder = "Skriv om meningen korrekt...";
      p2.appendChild(input);
      p2.appendChild(resultMark);
      row.appendChild(p2);
      getResult = () => ({ correct: item.accepted.includes(normalizeAnswer(input.value)), correctText: item.correctDisplay, given: input.value.trim() || null });
    }

    else if (ex.type === "ordna") {
      const built = document.createElement("div");
      built.style.cssText = "min-height:28px; border:1px dashed var(--border); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:14px;";
      const pool = document.createElement("div");
      pool.style.cssText = "display:flex; flex-wrap:wrap; gap:6px;";
      let picked = [];
      const chipButtons = item.chips.map((chip, i) => {
        const b = document.createElement("button");
        b.className = "match-btn";
        b.textContent = chip;
        b.onclick = () => {
          if (picked.includes(i)) return;
          picked.push(i);
          refresh();
        };
        return b;
      });
      function refresh() {
        built.innerHTML = picked.length ? picked.map(i => item.chips[i]).join(" ") : "&nbsp;";
        pool.querySelectorAll("button").forEach((b, i) => { b.style.display = picked.includes(i) ? "none" : "inline-block"; });
      }
      const resetBtn = document.createElement("button");
      resetBtn.className = "btn btn-outline";
      resetBtn.style.cssText = "font-size:11px; padding:3px 8px; margin-top:4px;";
      resetBtn.textContent = "Börja om";
      resetBtn.onclick = () => { picked = []; refresh(); };
      chipButtons.forEach(b => pool.appendChild(b));
      row.appendChild(built);
      row.appendChild(pool);
      row.appendChild(resetBtn);
      row.appendChild(resultMark);
      refresh();
      getResult = () => ({
        correct: JSON.stringify(picked) === JSON.stringify(item.correctOrder),
        correctText: item.target,
        given: picked.length ? picked.map(i => item.chips[i]).join(" ") : null
      });
    }

    else if (ex.type === "bild_flerval") {
      const imgWrap = document.createElement("div");
      imgWrap.innerHTML = sceneSVG(item.object, item.position);
      row.appendChild(imgWrap);
      const p = document.createElement("p");
      p.style.cssText = "font-size:14px; margin:0 0 6px; text-align:center;";
      p.append(item.question);
      p.appendChild(resultMark);
      row.appendChild(p);
      const optWrap = document.createElement("div");
      optWrap.className = "options";
      optWrap.style.justifyContent = "center";
      let chosen = null;
      item.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = opt;
        b.onclick = () => {
          chosen = i;
          optWrap.querySelectorAll("button").forEach(x => { x.style.background = ""; x.style.color = ""; });
          b.style.background = "var(--accent)"; b.style.color = "var(--accent-contrast)";
        };
        optWrap.appendChild(b);
      });
      row.appendChild(optWrap);
      getResult = () => ({ correct: chosen === item.correctIndex, correctText: item.options[item.correctIndex], given: chosen !== null ? item.options[chosen] : null });
    }

    else if (ex.type === "flerval_abc") {
      const p = document.createElement("p");
      p.style.cssText = "font-size:14px; margin:0 0 6px;";
      p.append(item.question);
      p.appendChild(resultMark);
      row.appendChild(p);
      const optWrap = document.createElement("div");
      optWrap.className = "options";
      let chosen = null;
      const letters = ["a", "b", "c"];
      item.options.forEach((opt, i) => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.textContent = letters[i] + ") " + opt;
        b.onclick = () => {
          chosen = i;
          optWrap.querySelectorAll("button").forEach(x => { x.style.background = ""; x.style.color = ""; });
          b.style.background = "var(--accent)"; b.style.color = "var(--accent-contrast)";
        };
        optWrap.appendChild(b);
      });
      row.appendChild(optWrap);
      getResult = () => ({ correct: chosen === item.correctIndex, correctText: letters[item.correctIndex] + ") " + item.options[item.correctIndex], given: chosen !== null ? letters[chosen] + ") " + item.options[chosen] : null });
    }

    // Facit-förklaring: unik för frågan (item.why) om den finns, annars övningens
    // gemensamma regelförklaring (ex.rule) om den finns, annars ingen förklaring alls.
    const originalGetResult = getResult;
    getResult = () => {
      const r = originalGetResult();
      r.why = item.why || ex.rule || null;
      return r;
    };

    const whyNote = document.createElement("p");
    whyNote.style.cssText = "display:none; font-size:12px; color:var(--text-secondary); background:var(--card-alt); border-radius:6px; padding:6px 8px; margin:4px 0 0;";
    row.appendChild(whyNote);

    itemGetters.push({ getResult, resultMark, whyNote });
    list.appendChild(row);
  });

  container.appendChild(list);

  const checkBtn = document.createElement("button");
  checkBtn.className = "btn btn-accent";
  checkBtn.style.marginTop = "12px";
  checkBtn.textContent = "Rätta allt";
  const summary = document.createElement("p");
  summary.style.cssText = "font-size:14px; font-weight:600; margin-top:8px;";

  checkBtn.onclick = () => {
    let correctCount = 0;
    const snapshot = [];
    itemGetters.forEach(({ getResult, resultMark, whyNote }) => {
      const r = getResult();
      snapshot.push({ given: r.given, correct: r.correct, correctText: r.correctText });
      if (r.correct) {
        correctCount++;
        resultMark.textContent = "✓";
        resultMark.style.color = "var(--success-text)";
        whyNote.style.display = "none";
      } else {
        resultMark.textContent = "✗ rätt svar: " + r.correctText;
        resultMark.style.color = "var(--danger-text)";
        if (r.why) {
          whyNote.textContent = r.why;
          whyNote.style.display = "block";
        } else {
          whyNote.style.display = "none";
        }
      }
    });
    const total = itemGetters.length;
    const pct = Math.round((correctCount / total) * 100);
    summary.textContent = `${correctCount} av ${total} rätt (${pct}%)`;
    summary.style.color = pct >= 75 ? "var(--success-text)" : pct >= 45 ? "var(--warning-text)" : "var(--danger-text)";
    const result = pct >= 90 ? "korrekt" : pct >= 45 ? "nastan" : "fel";
    saveAttempt(categoryId, ex.id, result, { score: pct, correctCount, total });
    saveLatestState(categoryId, ex.id, snapshot, pct);
  };

  container.appendChild(checkBtn);
  container.appendChild(summary);
  return container;
}

function showFeedback(container, kind, text) {
  let f = container.querySelector(".feedback");
  if (!f) {
    f = document.createElement("p");
    container.appendChild(f);
  }
  f.className = "feedback " + kind;
  f.textContent = text;
}

window.toggleBlock = function (headerEl) {
  const body = headerEl.nextElementSibling;
  const chev = headerEl.querySelector(".chev");
  const isOpen = body.classList.contains("open");
  body.classList.toggle("open", !isOpen);
  if (chev) chev.classList.toggle("open", !isOpen);
};

renderHub();

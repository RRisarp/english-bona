<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engelska – lärarvy</title>

<!--
  =====================================================================
  ENGELSKA-HUBBEN — lärarsida
  =====================================================================
  Kräver att den inloggade har ett dokument i Firestore-samlingen
  "teachers" med sitt eget UID som dokument-id, annars nekas åtkomst
  (styrs av säkerhetsreglerna, inte bara detta gränssnitt).

  Fältet "kanRedigera" (sant/falskt) på lärardokumentet styr om fliken
  "Lägg till övning" visas – se genomgången i chatten för hur du
  lägger till en kollega med rätt behörighet.
  =====================================================================
-->

<style>
  :root {
    --bg: #F5EFE4; --card: #FFFFFF; --card-alt: #FBF8F3;
    --border: #D9CFBB; --text: #2C2620; --text-secondary: #6B6255; --text-muted: #B4AFA2;
    --accent: #0F6E56; --accent-contrast: #FFFFFF;
    --success-bg: #DCEFE6; --success-text: #0B4F3D;
    --warning-bg: #F7E3C4; --warning-text: #7A5A0B;
    --danger-bg: #F6DCD3; --danger-text: #8C3A1E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif; line-height: 1.6;
  }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 20px 80px; }

  .hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; margin-bottom: 20px; }
  .hero h1 { font-size: 22px; margin-bottom: 6px; }
  .hero p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
  .btn { border: none; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-accent { background: var(--accent); color: var(--accent-contrast); }
  .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }

  .tabs { display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab { background: none; border: none; padding: 10px 16px; font-size: 14px; font-family: inherit; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  #accessDenied, #loadingState { text-align: center; padding: 60px 20px; color: var(--text-secondary); }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: center; }
  th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  td:first-child, th:first-child { text-align: left; font-weight: 500; }
  td.cell { border-radius: 6px; font-weight: 600; }
  .cell-empty { color: var(--text-muted); background: var(--card-alt); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card .top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
  .card .name { font-weight: 600; }
  .card .meta { color: var(--text-muted); }
  .answer-box { font-size: 14px; background: var(--card-alt); border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
  textarea, input, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 14px; font-family: inherit;
  }
  .grade-btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn-approve { background: var(--success-bg); color: var(--success-text); border: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .btn-revise { background: var(--warning-bg); color: var(--warning-text); border: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }

  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; }
  .opt-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .opt-row input[type=text] { flex: 1; }
  #formStatus { font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Engelska – lärarvy</h1>
    <p id="heroSub">Logga in med ditt lärarkonto.</p>
    <button class="btn btn-accent" id="loginBtn">Logga in med Google</button>
  </div>

  <div id="loadingState" style="display:none;">Kontrollerar behörighet...</div>
  <div id="accessDenied" style="display:none;">Det här kontot har inte lärarbehörighet på den här sidan.</div>

  <div id="teacherArea" style="display:none;">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('oversikt')">Översikt</button>
      <button class="tab" onclick="switchTab('ratta')">Att rätta <span id="pendingBadge"></span></button>
      <button class="tab" id="tabAddBtn" onclick="switchTab('lagg')" style="display:none;">Lägg till övning</button>
    </div>

    <div id="tab-oversikt"></div>
    <div id="tab-ratta" style="display:none;"></div>
    <div id="tab-lagg" style="display:none;"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collectionGroup, collection, query, where,
  getDocs, updateDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAsz_dRu2SqcTWqSwxKbwcWCREhcoIWRF4",
  authDomain: "english-bona-eb2c6.firebaseapp.com",
  projectId: "english-bona-eb2c6",
  storageBucket: "english-bona-eb2c6.firebasestorage.app",
  messagingSenderId: "513678315631",
  appId: "1:513678315631:web:6dd1569aae4edfa5507d9a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
let canEdit = false;

// Samma kategorilista som i index.html, bara namn+id (för rubriker i tabellen).
const CATEGORIES = [
  { id: "beskriva", title: "Beskriva" },
  { id: "vanor", title: "Vanor" },
  { id: "nuet", title: "Just nu" },
  { id: "berata", title: "Hänt" },
  { id: "framtid", title: "Framtid" },
  { id: "fragor", title: "Frågor" },
  { id: "situationer", title: "Situationer" },
  { id: "jamfora", title: "Jämföra" },
  { id: "kanslor", title: "Känslor" }
];

document.getElementById("loginBtn").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { console.error(e); alert("Inloggningen misslyckades."); }
};

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  const loginBtn = document.getElementById("loginBtn");
  const heroSub = document.getElementById("heroSub");
  const teacherArea = document.getElementById("teacherArea");
  const denied = document.getElementById("accessDenied");
  const loading = document.getElementById("loadingState");

  if (!user) {
    heroSub.textContent = "Logga in med ditt lärarkonto.";
    loginBtn.textContent = "Logga in med Google";
    loginBtn.onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
    teacherArea.style.display = "none";
    denied.style.display = "none";
    loading.style.display = "none";
    return;
  }

  loginBtn.textContent = "Logga ut";
  loginBtn.onclick = () => signOut(auth);
  heroSub.textContent = "Inloggad som " + (user.displayName || user.email);
  loading.style.display = "block";

  try {
    const teacherDoc = await getDoc(doc(db, "teachers", user.uid));
    loading.style.display = "none";
    if (!teacherDoc.exists()) {
      denied.style.display = "block";
      teacherArea.style.display = "none";
      return;
    }
    canEdit = teacherDoc.data().kanRedigera === true;
    document.getElementById("tabAddBtn").style.display = canEdit ? "inline-block" : "none";
    denied.style.display = "none";
    teacherArea.style.display = "block";
    loadOverview();
    loadQueue();
  } catch (e) {
    loading.style.display = "none";
    denied.textContent = "Kunde inte kontrollera behörighet: " + e.message;
    denied.style.display = "block";
  }
});

window.switchTab = function (name) {
  ["oversikt", "ratta", "lagg"].forEach(t => {
    document.getElementById("tab-" + t).style.display = t === name ? "block" : "none";
  });
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  event.target.closest("button").classList.add("active");
};

// ============ ÖVERSIKT (heatmap) ============
async function loadOverview() {
  const container = document.getElementById("tab-oversikt");
  container.innerHTML = "<p style='color:var(--text-secondary); font-size:13px;'>Laddar...</p>";

  const q = query(collectionGroup(db, "attempts"), where("subject", "==", "engelska"));
  const snap = await getDocs(q);

  // students: { name -> { categoryId -> { correct, near, total } } }
  const students = {};
  snap.forEach(docSnap => {
    const d = docSnap.data();
    if (!d.categoryId) return;
    const name = d.studentName || "Okänd deltagare";
    if (!students[name]) students[name] = {};
    if (!students[name][d.categoryId]) students[name][d.categoryId] = { correct: 0, near: 0, total: 0 };
    const stat = students[name][d.categoryId];
    if (d.result === "korrekt") stat.correct++;
    else if (d.result === "nastan") stat.near++;
    if (d.result === "korrekt" || d.result === "nastan" || d.result === "fel") stat.total++;
  });

  const names = Object.keys(students).sort();
  if (names.length === 0) {
    container.innerHTML = "<p style='color:var(--text-secondary); font-size:13px;'>Inga försök registrerade än.</p>";
    return;
  }

  let html = "<table><tr><th>Deltagare</th>";
  CATEGORIES.forEach(c => html += `<th>${c.title}</th>`);
  html += "</tr>";

  names.forEach(name => {
    html += `<tr><td>${name}</td>`;
    CATEGORIES.forEach(c => {
      const stat = students[name][c.id];
      if (!stat || stat.total === 0) {
        html += `<td class="cell cell-empty">–</td>`;
      } else {
        const pct = Math.round(((stat.correct + stat.near * 0.5) / stat.total) * 100);
        let bg = "var(--danger-bg)", fg = "var(--danger-text)";
        if (pct >= 75) { bg = "var(--success-bg)"; fg = "var(--success-text)"; }
        else if (pct >= 45) { bg = "var(--warning-bg)"; fg = "var(--warning-text)"; }
        html += `<td class="cell" style="background:${bg}; color:${fg};">${pct}%</td>`;
      }
    });
    html += "</tr>";
  });
  html += "</table>";
  container.innerHTML = html;
}

// ============ ATT RÄTTA (kö) ============
async function loadQueue() {
  const container = document.getElementById("tab-ratta");
  container.innerHTML = "<p style='color:var(--text-secondary); font-size:13px;'>Laddar...</p>";

  const q = query(
    collectionGroup(db, "attempts"),
    where("subject", "==", "engelska"),
    where("gradingType", "==", "larare"),
    where("status", "==", "pending")
  );
  const snap = await getDocs(q);
  document.getElementById("pendingBadge").textContent = snap.size > 0 ? `(${snap.size})` : "";

  if (snap.empty) {
    container.innerHTML = "<p style='color:var(--text-secondary); font-size:13px;'>Inget väntar på rättning just nu.</p>";
    return;
  }

  container.innerHTML = "";
  snap.forEach(docSnap => {
    const d = docSnap.data();
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="top">
        <span class="name">${d.studentName || "Okänd deltagare"}</span>
        <span class="meta">${d.categoryId} · ${d.exerciseId}</span>
      </div>
      <p class="answer-box">${escapeHtml(d.text || "")}</p>
      <textarea placeholder="Kommentar (valfritt)" style="width:100%; min-height:44px;"></textarea>
      <div class="grade-btns">
        <button class="btn-approve">Godkänd</button>
        <button class="btn-revise">Behöver ses över</button>
      </div>
    `;
    const textarea = card.querySelector("textarea");
    card.querySelector(".btn-approve").onclick = () => gradeAttempt(docSnap.ref, "approved", textarea.value, card);
    card.querySelector(".btn-revise").onclick = () => gradeAttempt(docSnap.ref, "needs_revision", textarea.value, card);
    container.appendChild(card);
  });
}

async function gradeAttempt(ref, status, comment, cardEl) {
  try {
    await updateDoc(ref, { status, comment: comment || "", gradedAt: serverTimestamp(), gradedBy: currentUser.uid });
    cardEl.remove();
    loadOverview();
    loadQueue();
  } catch (e) {
    alert("Kunde inte spara rättningen: " + e.message);
  }
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// ============ LÄGG TILL ÖVNING ============
function renderAddForm() {
  const container = document.getElementById("tab-lagg");
  container.innerHTML = `
    <div class="card" style="max-width:480px;">
      <div class="form-field">
        <label>Kategori</label>
        <select id="f-category">
          ${CATEGORIES.map(c => `<option value="${c.id}">${c.title}</option>`).join("")}
        </select>
      </div>
      <div class="form-field">
        <label>Övningstyp</label>
        <select id="f-type" onchange="renderTypeFields()">
          <option value="flerval">Flerval</option>
          <option value="lucktext">Lucktext</option>
          <option value="oversattning">Översättning</option>
          <option value="santfalskt">Sant/falskt</option>
          <option value="lararrattad">Lärarrättad (fri text)</option>
        </select>
      </div>
      <div id="typeFields"></div>
      <button class="btn btn-accent" onclick="saveExercise()">Spara övning</button>
      <p id="formStatus"></p>
    </div>
  `;
  renderTypeFields();
}

window.renderTypeFields = function () {
  const type = document.getElementById("f-type").value;
  const el = document.getElementById("typeFields");
  if (type === "flerval") {
    el.innerHTML = `
      <div class="form-field"><label>Fråga</label><input type="text" id="f-question"></div>
      <div class="form-field"><label>Alternativ (kryssa i det rätta)</label>
        <div class="opt-row"><input type="text" placeholder="Alternativ 1"><input type="checkbox"></div>
        <div class="opt-row"><input type="text" placeholder="Alternativ 2"><input type="checkbox"></div>
        <div class="opt-row"><input type="text" placeholder="Alternativ 3"><input type="checkbox"></div>
        <div class="opt-row"><input type="text" placeholder="Alternativ 4"><input type="checkbox"></div>
      </div>`;
  } else if (type === "lucktext" || type === "oversattning") {
    el.innerHTML = `
      <div class="form-field"><label>${type === "lucktext" ? "Mening med lucka (skriv ___ där luckan ska vara)" : "Ord/mening att översätta"}</label><input type="text" id="f-question"></div>
      <div class="form-field"><label>Godkända svar (kommaseparerade)</label><input type="text" id="f-accepted"></div>`;
  } else if (type === "santfalskt") {
    el.innerHTML = `
      <div class="form-field"><label>Påstående</label><input type="text" id="f-question"></div>
      <div class="form-field"><label>Rätt svar</label>
        <select id="f-correct"><option value="true">Sant</option><option value="false">Falskt</option></select>
      </div>`;
  } else if (type === "lararrattad") {
    el.innerHTML = `<div class="form-field"><label>Instruktion till deltagaren</label><input type="text" id="f-question"></div>`;
  }
};

window.saveExercise = async function () {
  const status = document.getElementById("formStatus");
  const categoryId = document.getElementById("f-category").value;
  const type = document.getElementById("f-type").value;
  const question = document.getElementById("f-question")?.value.trim();

  if (!question) { status.textContent = "Fyll i frågan/instruktionen först."; return; }

  const data = { subject: "engelska", categoryId, type, question, createdBy: currentUser.uid, createdAt: serverTimestamp() };

  if (type === "flerval") {
    const rows = document.querySelectorAll("#typeFields .opt-row");
    data.options = []; data.correctIndex = 0;
    rows.forEach((row, i) => {
      const text = row.querySelector("input[type=text]").value.trim();
      const checked = row.querySelector("input[type=checkbox]").checked;
      if (text) data.options.push(text);
      if (checked) data.correctIndex = i;
    });
  } else if (type === "lucktext" || type === "oversattning") {
    data.accepted = document.getElementById("f-accepted").value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
  } else if (type === "santfalskt") {
    data.correct = document.getElementById("f-correct").value === "true";
  }

  try {
    await addDoc(collection(db, "exercises"), data);
    status.textContent = "Sparad! (Observera: deltagarsidan behöver kopplas till denna datakälla i ett nästa steg — se kommentar i chatten.)";
  } catch (e) {
    status.textContent = "Kunde inte spara: " + e.message;
  }
};

renderAddForm();
</script>
</body>
</html>
